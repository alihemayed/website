<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enquiry Sent | Ali Hemayed Photography</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--warm:#faf9f7;--charcoal:#1a1917;--mid:#6b6660;--gold:#c9a96e}
body{min-height:100vh;display:grid;place-items:center;background:var(--warm);color:var(--charcoal);font-family:'Jost',sans-serif;font-weight:300;padding:2rem}
main{max-width:620px;text-align:center}
p:first-child{font-size:.64rem;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);margin-bottom:1.2rem}
h1{font-family:'Cormorant Garamond',serif;font-size:clamp(2.5rem,6vw,4.4rem);font-weight:300;line-height:1.05;margin-bottom:1.2rem}
h1 em{font-style:italic}
p{font-size:.95rem;line-height:1.8;color:var(--mid);margin-bottom:2rem}
a{display:inline-block;background:var(--charcoal);color:var(--gold);text-decoration:none;padding:1rem 2rem;font-size:.7rem;font-weight:400;letter-spacing:.24em;text-transform:uppercase;transition:background .3s,color .3s}
a:hover{background:var(--gold);color:var(--charcoal)}
</style>
</head>
<body>
<main>
  <p>Enquiry Sent</p>
  <h1>Thank you<br><em>for getting in touch</em></h1>
  <p>Your enquiry has been submitted. Ali will follow up as soon as possible.</p>
  <a href="/">Return Home</a>
</main>
</body>
</html>
